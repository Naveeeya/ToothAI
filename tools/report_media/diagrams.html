<!-- 2. OPG engine v2 -->
<figure id="opg-engine">
<h2>OPG analysis pipeline (engine v2)</h2>
<p class="sub">From a panoramic radiograph to a numbered dental chart. Grey notes show what the published engine (v1) did differently.</p>
<svg width="1176" height="720" viewBox="0 0 1176 720">
  <rect class="box ice" x="10" y="30" width="170" height="80"/><text class="t" x="95" y="64" text-anchor="middle">Panoramic X-ray</text>
  <text class="s" x="95" y="86" text-anchor="middle">pixels only, ≤ 60 MP</text>
  <path class="arrow" d="M180,70 L225,70"/>
  <rect class="box" x="230" y="30" width="250" height="80"/><text class="t" x="245" y="60">Mask R-CNN, one pass</text>
  <text class="s" x="245" y="82">teeth + findings with masks, score ≥ 0.05</text>
  <text class="s" x="245" y="100">short edge 800 px (training size)</text>
  <path class="arrow" d="M480,70 L515,70"/>
  <rect class="box" x="520" y="30" width="200" height="80"/><text class="t" x="535" y="60">Tooth threshold</text>
  <text class="s" x="535" y="82">0.20 everywhere</text>
  <path class="arrow" d="M720,70 L755,70"/>
  <rect class="box" x="760" y="30" width="200" height="80"/><text class="t" x="775" y="60">DIoU-NMS 0.4</text>
  <text class="s" x="775" y="82">overlapping boxes</text>
  <path class="arrow" d="M960,70 L1000,70 L1000,215 L965,215"/>
  <text class="s" x="245" y="132">v1: two passes (original + CLAHE); one-pass</text>
  <text class="s" x="245" y="148">hits × 0.6, so real teeth fell under 0.20</text>
  <text class="s" x="535" y="132">v1: 0.14 in the central zone,</text>
  <text class="s" x="535" y="148">which is the easy zone</text>
  <rect class="box spark" x="760" y="175" width="200" height="80"/><text class="t w" x="775" y="205">Duplicate removal</text>
  <text class="s w" x="775" y="227">mask mostly inside a</text><text class="s w" x="775" y="243">stronger detection</text>
  <path class="arrow" d="M760,215 L725,215"/>
  <rect class="box spark" x="520" y="175" width="200" height="80"/><text class="t w" x="535" y="205">Cap before numbering</text>
  <text class="s w" x="535" y="227">32 by score, 16 per jaw;</text><text class="s w" x="535" y="243">never delete a tooth</text>
  <path class="arrow" d="M520,215 L485,215"/>
  <rect class="box spark" x="230" y="175" width="250" height="80"/><text class="t w" x="245" y="205">Jaw split by bite line</text>
  <text class="s w" x="245" y="227">quadratic fit through each jaw,</text><text class="s w" x="245" y="243">line half-way between them</text>
  <path class="arrow" d="M355,255 L355,312"/>
  <rect class="box spark" x="230" y="315" width="250" height="80"/><text class="t w" x="245" y="345">Dental midline</text>
  <text class="s w" x="245" y="367">gap whose two sides best mirror</text><text class="s w" x="245" y="383">each other's tooth widths</text>
  <path class="arrow" d="M480,355 L515,355"/>
  <rect class="box spark" x="520" y="315" width="440" height="80"/><text class="t w" x="535" y="345">FDI numbering by position</text>
  <text class="s w" x="535" y="367">distance from the midline in tooth widths, aligned in order</text>
  <text class="s w" x="535" y="383">to a template from the training split; gaps stay empty</text>
  <path class="arrow" d="M960,355 L1000,355 L1000,475 L965,475"/>
  <text class="s" x="10" y="190">v1 instead:</text>
  <text class="s" x="10" y="208">• median-height jaw split</text>
  <text class="s" x="10" y="224">  (forces equal halves)</text>
  <text class="s" x="10" y="242">• pruned after numbering</text>
  <text class="s" x="10" y="260">• conflict losers deleted</text>
  <text class="s" x="10" y="278">• numbered from the</text>
  <text class="s" x="10" y="294">  patient's right end</text>
  <rect class="box" x="760" y="435" width="200" height="80"/><text class="t" x="775" y="465">Findings → teeth</text>
  <text class="s" x="775" y="487">best IoU &gt; 0.15, else</text><text class="s" x="775" y="503">"not mapped to a tooth"</text>
  <path class="arrow" d="M760,475 L725,475"/>
  <rect class="box" x="520" y="435" width="200" height="80"/><text class="t" x="535" y="465">Anatomical checks</text>
  <text class="s" x="535" y="487">caries next to metal</text><text class="s" x="535" y="503">restorations down-weighted</text>
  <path class="arrow" d="M520,475 L485,475"/>
  <rect class="box ice" x="230" y="435" width="250" height="80"/><text class="t" x="245" y="465">Outputs</text>

  <text class="t" x="30" y="590">Measured on the 716-image test split (paper_eval, paired bootstrap 95 % CI)</text>
  <text class="s" x="30" y="616">FDI accuracy, 117 canonical images: v1 61.6 % → v2 85.8 % (+24.2 pp [+18.6, +30.0]) · complete arches 76.6 → 90.6 % · partial arches 35.4 → 77.4 %</text>
  <text class="s" x="30" y="638">Tooth detection recall, 93 full-arch images: 94.3 → 95.5 % (+1.2 pp [+0.7, +1.7]). Every v2 choice was made on the validation split.</text>
  <text class="s" x="30" y="660">Still open: 3.7 % of teeth (mostly second molars) are never detected by the model; that needs retraining.</text>
</svg>

<!-- 3. Photo screening -->
<figure id="photo-pipeline">
<h2>Photo screening pipeline</h2>
<p class="sub">Up to five smartphone photos in, a screening report out. A screening aid, not a diagnosis: it recommends an OPG when something is seen.</p>
<svg width="1176" height="560" viewBox="0 0 1176 560">
  <rect class="box ice" x="10" y="40" width="170" height="120"/><text class="t" x="95" y="74" text-anchor="middle">5 photos</text>
  <text class="s" x="95" y="96" text-anchor="middle">front, upper, lower,</text><text class="s" x="95" y="114" text-anchor="middle">left, right</text>
  <text class="s" x="95" y="140" text-anchor="middle">consent required</text>
  <path class="arrow" d="M180,100 L220,100"/>
  <rect class="box" x="225" y="40" width="190" height="120"/><text class="t" x="240" y="70">Clean the upload</text>
  <text class="s" x="240" y="92">EXIF, GPS, device data</text><text class="s" x="240" y="110">removed; neutral names;</text>
  <text class="s" x="240" y="128">orientation applied</text>
  <path class="arrow" d="M415,100 L455,100"/>
  <rect class="box" x="460" y="40" width="190" height="120"/><text class="t" x="475" y="70">Quality gate</text>
  <text class="s" x="475" y="92">blur, exposure,</text><text class="s" x="475" y="110">resolution (hard);</text>
  <text class="s" x="475" y="128">mouth check</text><text class="s" x="475" y="146">→ retake tips</text>
  <path class="arrow" d="M650,100 L690,100"/>
  <rect class="box" x="695" y="20" width="270" height="160"/><text class="tag" x="710" y="44">THREE DETECTORS</text>
  <text class="t" x="710" y="68">AlphaDent YOLOv8x-seg</text><text class="s" x="710" y="86">wear, fillings, crowns, caries</text>
  <text class="t" x="710" y="110">AKU caries YOLOv8s</text><text class="s" x="710" y="128">+ grey-world copy (indoor light)</text>
  <text class="t" x="710" y="152">DentalAI teeth YOLOv8s-seg</text><text class="s" x="710" y="170">tooth outlines and positions</text>
  <path class="arrow" d="M965,100 L1005,100"/>
  <rect class="box" x="1010" y="40" width="156" height="120"/><text class="t" x="1025" y="70">Fuse</text>
  <text class="s" x="1025" y="92">same spot across</text><text class="s" x="1025" y="110">models: IoU 0.55</text><text class="s" x="1025" y="128">or 60 % inside</text>
  <path class="arrow" d="M1088,160 L1088,215 L965,215"/>
  <rect class="box spark" x="460" y="200" width="505" height="150"/><text class="tag w" x="475" y="224" style="fill:#fff">FIXED RULES (NOT AI), EACH MEASURED</text>
  <text class="s w" x="475" y="250">• AlphaDent caries alone dropped (2–5 % precision on phone photos)</text>
  <text class="s w" x="475" y="272">• weak agreement kept: phone model 0.20–0.48 + AlphaDent ≥ 0.50 (10 of 13 real)</text>
  <text class="s w" x="475" y="294">• decay wins over a "filling" on the same spot; fillings/crowns from 0.55</text>
  <text class="s w" x="475" y="316">• wear/restorations at the frame edge dropped (fingers); cavity/crack off</text>
  <text class="s w" x="475" y="338">• bands: High needs a phone-trained model or two agreeing models</text>
  <path class="arrow" d="M460,275 L420,275"/>
  <rect class="box" x="225" y="200" width="190" height="150"/><text class="t" x="240" y="230">Triage</text>
  <text class="s" x="240" y="254">PROMPT · SOON · ROUTINE</text>
  <text class="t" x="240" y="286">Screening index</text>
  <text class="s" x="240" y="308">100 − capped deductions</text><text class="s" x="240" y="326">(decay ≤ 40, wear ≤ 3,</text><text class="s" x="240" y="342">restorations ≤ 5)</text>
  <path class="arrow" d="M225,275 L185,275"/>
  <rect class="box ice" x="10" y="200" width="170" height="150"/><text class="t" x="95" y="232" text-anchor="middle">Report</text>
  <text class="s" x="95" y="256" text-anchor="middle">annotated photos,</text><text class="s" x="95" y="274" text-anchor="middle">plain-language summary,</text>
  <text class="s" x="95" y="292" text-anchor="middle">what photos can't show,</text><text class="s" x="95" y="310" text-anchor="middle">PDF with QR code</text>
  <text class="s" x="95" y="336" text-anchor="middle">→ OPG on Analyse</text>
  <rect class="box warn" x="10" y="390" width="1156" height="150"/>
  <text class="t" x="30" y="420">Measured on the AKU test split (628 smartphone photos, 95 % Wilson intervals)</text>
  <text class="s" x="30" y="446">Photos with caries referred for a check-up or dentist: 90.7 % [86.2, 93.8] · caries-free photos referred anyway: 5.6 % [3.7, 8.3]</text>
  <text class="s" x="30" y="468">Image-level sensitivity 92.0 % · specificity 92.9 % · caries model mAP@50 0.764 (published YOLOv8s baseline 0.841), classes merged AP@50 0.895</text>
  <text class="s" x="30" y="490">Not validated on phone photos: wear, fillings, crowns. Photos cannot show decay between teeth, below the gum or in the bone.</text>
  <text class="s" x="30" y="512">Optional AI notes (local Ollama qwen2.5vl, JSON) may only add gum/hygiene observations; the template summary is the fallback.</text>
</svg>
</figure>

<!-- 5. Evaluation method -->
<figure id="evaluation">
<h2>How the numbers were measured</h2>
<p class="sub">Each data split has one job, so no design decision is tuned on the images it is reported on.</p>
<svg width="1176" height="420" viewBox="0 0 1176 420">
  <rect class="box" x="10" y="30" width="360" height="200"/><text class="tag" x="30" y="56">TRAIN · 5,584 OPGs</text>
  <text class="t" x="30" y="84">Model training</text><text class="s" x="30" y="104">Mask R-CNN teeth and findings models</text>
  <text class="t" x="30" y="138">Arch template</text><text class="s" x="30" y="158">tooth positions from 866 upper and</text>
  <text class="s" x="30" y="176">887 lower jaws (canonical labels)</text>
