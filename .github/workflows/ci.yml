name: ToothAI app

# The OPG app's unit tests (routing fix, regions, notation, engine parity with paper_eval, reliability,
# PDF escaping). They run in demo mode: no Detectron2, no GPU, no weights. The photo screening service
# has its own workflow (photo-screening.yml).
on:
  push:
    branches: [main]
    paths-ignore: ["photo_screening/**", "**/*.md"]
  pull_request:
    paths-ignore: ["photo_screening/**", "**/*.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install (app requirements, without the brand-asset renderer)
        run: |
          grep -v -E "^cairosvg" requirements-app.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Test
        env:
          TOOTH_AI_DEMO: "1"
        run: python -m pytest -q tests/
