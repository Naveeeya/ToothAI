<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooth-AI logo explorations</title>
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bone-50); color: var(--ink-900); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; } p { color: var(--ink-500); margin: 0 0 24px; }
  section { background: var(--white); border: 1px solid var(--slate-300); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  h2 { font-size: 15px; margin: 0 0 14px; }
  .row { display: flex; gap: 24px; align-items: end; flex-wrap: wrap; }
  .row figure { margin: 0; text-align: center; font-size: 12px; color: var(--ink-500); }
  .row figure img { display: block; margin: 0 auto 6px; }
  .dark { background: var(--ink-900); color: var(--slate-300); }
  .dark figure { color: var(--slate-300); }
  .lockups img { max-width: 100%; height: auto; }
</style>
</head>
<body>
<main>
  <h1>Tooth-AI: logo explorations</h1>
  <p>A: Arch Nodes (primary) · B: Quadrant Tooth (alternate). Check legibility at 16 and 32 px on both backgrounds.</p>
  <section><h2>A · Arch Nodes: light</h2><div class="row">
    <figure><img src="tooth-ai-favicon.svg" width="16" height="16" alt="">16</figure>
    <figure><img src="tooth-ai-favicon.svg" width="32" height="32" alt="">32</figure>
    <figure><img src="tooth-ai-mark.svg" width="64" height="64" alt="">64</figure>
    <figure><img src="tooth-ai-mark.svg" width="256" height="256" alt="">256</figure>
    <figure><img src="tooth-ai-mark-mono-dark.svg" width="64" height="64" alt="">mono</figure>
  </div></section>
  <section class="dark"><h2>A · Arch Nodes: dark</h2><div class="row">
    <figure><img src="tooth-ai-favicon.svg" width="16" height="16" alt="">16</figure>
    <figure><img src="tooth-ai-favicon.svg" width="32" height="32" alt="">32</figure>
    <figure><img src="tooth-ai-mark.svg" width="64" height="64" alt="">64</figure>
    <figure><img src="tooth-ai-mark.svg" width="256" height="256" alt="">256</figure>
    <figure><img src="tooth-ai-mark-mono-light.svg" width="64" height="64" alt="">mono</figure>
  </div></section>
  <section><h2>B · Quadrant Tooth</h2><div class="row">
    <figure><img src="concept-b-quadrant-tooth.svg" width="16" height="16" alt="">16</figure>
    <figure><img src="concept-b-quadrant-tooth.svg" width="32" height="32" alt="">32</figure>
    <figure><img src="concept-b-quadrant-tooth.svg" width="64" height="64" alt="">64</figure>
    <figure><img src="concept-b-quadrant-tooth.svg" width="256" height="256" alt="">256</figure>
  </div></section>
  <section class="lockups"><h2>Lockups</h2>
    <img src="tooth-ai-lockup-horizontal.svg" width="320" alt="Tooth-AI horizontal lockup"><br><br>
    <img src="tooth-ai-lockup-stacked.svg" width="200" alt="Tooth-AI stacked lockup">
  </section>
  <section class="dark lockups"><h2>Reversed lockup and social card</h2>
    <img src="tooth-ai-lockup-horizontal-reversed.svg" width="320" alt="Tooth-AI reversed lockup"><br><br>
    <img src="og-1200x630.png" width="600" alt="Tooth-AI social card">
  </section>
</main>
</body>
</html>
